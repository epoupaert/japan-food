<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Gourmand du Japon - Checklist Culinaire</title>
    <!-- Application installable (PWA) -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#e53e3e" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Japan Food">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- Polices optionnelles : la page reste lisible hors ligne grâce aux polices système de secours -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fcf9f5;
            --card: #ffffff;
            --card-border: #ffedd5;
            --text: #2d3748;
            --heading: #111827;
            --muted: #6b7280;
            --faint: #9ca3af;
            --line: #f3f4f6;
            --accent: #e53e3e;
            --accent-strong: #b91c1c;
            --accent-soft: #fef2f2;
            --accent-soft-border: #fee2e2;
            --badge-bg: #fee2e2;
            --badge-text: #dc2626;
            --item-bg: #fafafa;
            --item-hover-bg: #ffffff;
            --item-hover-border: #fed7aa;
            --box-border: #d1d5db;
            --done: #a0aec0;
            --track: #f3f4f6;
            --btn-bg: #f3f4f6;
            --btn-hover: #e5e7eb;
            --btn-text: #374151;
            --plats-bg: #ffedd5;
            --encas-bg: #fef3c7;
            --desserts-bg: #fce7f3;
            --boissons-bg: #d1fae5;
            --shadow: 0 20px 25px -5px rgb(0 0 0 / 0.08), 0 8px 10px -6px rgb(0 0 0 / 0.08);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #17130f;
                --card: #211c17;
                --card-border: #3a2c20;
                --text: #e5e1dc;
                --heading: #faf7f2;
                --muted: #a8a29e;
                --faint: #8a837d;
                --line: #332b24;
                --accent: #ef5350;
                --accent-strong: #f87171;
                --accent-soft: #2e1d1b;
                --accent-soft-border: #4a2622;
                --badge-bg: #4a2622;
                --badge-text: #fca5a5;
                --item-bg: #29231d;
                --item-hover-bg: #302820;
                --item-hover-border: #7c4a24;
                --box-border: #6b625a;
                --done: #7d756e;
                --track: #332b24;
                --btn-bg: #332b24;
                --btn-hover: #40362d;
                --btn-text: #e5e1dc;
                --plats-bg: #43291a;
                --encas-bg: #403116;
                --desserts-bg: #46202f;
                --boissons-bg: #163a2c;
                --shadow: 0 20px 25px -5px rgb(0 0 0 / 0.4);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #17130f;
            --card: #211c17;
            --card-border: #3a2c20;
            --text: #e5e1dc;
            --heading: #faf7f2;
            --muted: #a8a29e;
            --faint: #8a837d;
            --line: #332b24;
            --accent: #ef5350;
            --accent-strong: #f87171;
            --accent-soft: #2e1d1b;
            --accent-soft-border: #4a2622;
            --badge-bg: #4a2622;
            --badge-text: #fca5a5;
            --item-bg: #29231d;
            --item-hover-bg: #302820;
            --item-hover-border: #7c4a24;
            --box-border: #6b625a;
            --done: #7d756e;
            --track: #332b24;
            --btn-bg: #332b24;
            --btn-hover: #40362d;
            --btn-text: #e5e1dc;
            --plats-bg: #43291a;
            --encas-bg: #403116;
            --desserts-bg: #46202f;
            --boissons-bg: #163a2c;
            --shadow: 0 20px 25px -5px rgb(0 0 0 / 0.4);
            color-scheme: dark;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px 16px;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }

        h1, h2, p { margin: 0; }

        .font-japanese {
            font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .page {
            position: relative;
            max-width: 56rem;
            margin: 0 auto;
            padding: 24px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .deco {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 300px;
            height: 300px;
            color: var(--accent);
            opacity: 0.05;
            pointer-events: none;
        }

        /* En-tête */
        header {
            position: relative;
            padding-bottom: 32px;
            margin-bottom: 32px;
            border-bottom: 2px solid var(--accent-soft-border);
        }

        .header-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .header-tags {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 999px;
            background: var(--badge-bg);
            color: var(--badge-text);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-jp {
            color: var(--accent-strong);
            font-size: 14px;
            font-weight: 700;
        }

        h1 {
            color: var(--heading);
            font-size: 30px;
            line-height: 36px;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .header-art {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            border-radius: 16px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-soft-border);
            line-height: 1;
        }

        .header-art span:nth-child(1) { font-size: 36px; }
        .header-art span:nth-child(2) { font-size: 24px; opacity: 0.75; }
        .header-art span:nth-child(3) { font-size: 30px; opacity: 0.9; }

        .progress-track {
            height: 12px;
            margin-top: 24px;
            overflow: hidden;
            border-radius: 999px;
            background: var(--track);
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
        }

        /* Catégories */
        main {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .category-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }

        .category-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 22px;
            line-height: 1;
        }

        .category-icon.plats { background: var(--plats-bg); }
        .category-icon.encas { background: var(--encas-bg); }
        .category-icon.desserts { background: var(--desserts-bg); }
        .category-icon.boissons { background: var(--boissons-bg); }

        h2 {
            color: var(--heading);
            font-size: 20px;
            line-height: 28px;
            font-weight: 700;
        }

        .category-jp {
            color: var(--faint);
            font-size: 12px;
        }

        .items {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        /* Éléments de la liste */
        .item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--item-bg);
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .item:hover {
            background: var(--item-hover-bg);
            border-color: var(--item-hover-border);
        }

        .checkbox-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            margin-top: 2px;
            border: 2px solid var(--box-border);
            border-radius: 6px;
            color: #ffffff;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .checkbox-icon svg {
            width: 12px;
            height: 12px;
            visibility: hidden;
        }

        .item input:checked + .checkbox-icon {
            background: var(--accent);
            border-color: var(--accent);
        }

        .item input:checked + .checkbox-icon svg {
            visibility: visible;
        }

        .item input:focus-visible + .checkbox-icon {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .item-title {
            display: block;
            color: var(--heading);
            font-size: 14px;
            font-weight: 600;
        }

        .item input:checked ~ .item-text .item-title {
            color: var(--done);
            text-decoration: line-through;
        }

        .item-desc {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.625;
        }

        /* Pied de page */
        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
        }

        .footer-note {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--faint);
            font-size: 12px;
            text-align: center;
        }

        .footer-note svg { width: 14px; height: 14px; flex-shrink: 0; }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 0;
            border-radius: 12px;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .btn svg { width: 16px; height: 16px; }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-neutral { background: var(--btn-bg); color: var(--btn-text); }
        .btn-neutral:hover { background: var(--btn-hover); }
        .btn-danger { background: var(--accent-soft); color: var(--badge-text); }
        .btn-danger:hover { background: var(--accent-soft-border); }

        @media (min-width: 640px) {
            body { padding: 32px 24px; }
            .page { padding: 40px; }
            .header-row { flex-direction: row; }
            h1 { font-size: 36px; line-height: 40px; }
            .subtitle { font-size: 16px; }
            footer { flex-direction: row; }
            .footer-note { text-align: left; }
        }

        @media (min-width: 768px) {
            .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print { display: none !important; }
            body { padding: 0; background: #ffffff; }
            .page {
                max-width: 100%;
                margin: 0;
                padding: 0;
                border: 0;
                box-shadow: none;
            }
            .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .category, .item { break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="page">

        <!-- Motif décoratif japonais en fond -->
        <svg class="deco" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
            <circle cx="50" cy="50" r="40"/>
        </svg>

        <!-- En-tête -->
        <header>
            <div class="header-row">
                <div>
                    <div class="header-tags">
                        <span class="badge">Voyage Culinaire</span>
                        <span class="header-jp font-japanese" lang="ja">日本グルメガイド</span>
                    </div>
                    <h1>Spécialités Japonaises</h1>
                    <p class="subtitle">La liste ultime des incontournables à goûter lors de votre séjour au Japon.</p>
                </div>

                <div class="header-art" aria-hidden="true">
                    <span>🍜</span><span>🥢</span><span>🍶</span>
                </div>
            </div>

            <!-- Barre de progression -->
            <div class="progress-track" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="progress-meta">
                <span id="progress-text"></span>
                <span id="progress-percent">0%</span>
            </div>
        </header>

        <!-- Conteneur des catégories (généré depuis les données ci-dessous) -->
        <main id="categories"></main>

        <!-- Pied de page / Actions -->
        <footer class="no-print">
            <div class="footer-note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
                <span id="storage-note">Vos coches sont enregistrées automatiquement sur cet appareil.</span>
            </div>
            <div class="actions">
                <button type="button" class="btn btn-neutral" onclick="window.print()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
                    </svg>
                    Imprimer / PDF
                </button>
                <button type="button" class="btn btn-danger" onclick="resetChecklist()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                    Réinitialiser
                </button>
            </div>
        </footer>

    </div>

    <script>
        // Données : pour ajouter un plat, ajoutez simplement une ligne dans la bonne catégorie.
        // Les coches sont enregistrées par nom : l'ordre peut changer sans rien casser.
        const categories = [
            {
                id: "plats", icon: "🍚", title: "Plats Principaux", jp: "主食 (Shushoku)",
                items: [
                    { name: "Ramen", desc: "Nouilles en bouillon riche avec porc chashu, œuf mollet et ciboule." },
                    { name: "Sushi & Sashimi", desc: "Poisson cru ultrafrais servi sur riz vinaigré ou tranché pur." },
                    { name: "Okonomiyaki", desc: "Galette salée au chou, garnitures variées, sauce douce et mayonnaise." },
                    { name: "Takoyaki", desc: "Boulettes fondantes et croustillantes fourrées de morceaux de poulpe." },
                    { name: "Tonkatsu", desc: "Épais filet de porc pané à la chapelure panko, servi croustillant." },
                    { name: "Tempura", desc: "Beignets légers et croustillants de légumes ou crevettes." },
                    { name: "Udon", desc: "Épaisses nouilles de blé moelleuses en bouillon dashi chaud ou froids." },
                    { name: "Soba", desc: "Nouilles de sarrasin au goût subtil, dégustées chaudes ou froides." },
                    { name: "Katsudon", desc: "Bol de riz recouvert de porc pané tonkatsu, œuf et oignons doux." },
                    { name: "Yakitori", desc: "Brochettes de poulet grillées au charbon, au sel ou sauce tare." },
                    { name: "Unadon / Unagi", desc: "Anguille grillée caramélisée au soja-mirin sur lit de riz chaud." },
                    { name: "Shabu-Shabu", desc: "Fondue de fines tranches de viande et légumes dans un bouillon léger." },
                    { name: "Gyudon", desc: "Bol de riz garni de fines tranches de bœuf et oignons mijotés." },
                    { name: "Sukiyaki", desc: "Plat mijoté sucré-salé avec bœuf, tofu et champignons à tremper dans l'œuf." }
                ]
            },
            {
                id: "encas", icon: "🍙", title: "En-cas & Street Food", jp: "軽食 (Keishoku)",
                items: [
                    { name: "Onigiri", desc: "Boulette de riz triangulaire entourée d'algue nori, fourrée au choix." },
                    { name: "Karaage", desc: "Bouchées de poulet marinées à la sauce soja/gingembre et frites." },
                    { name: "Nikuman", desc: "Brioche vapeur moelleuse fourrée au porc haché assaisonné." },
                    { name: "Senbei", desc: "Galettes de riz soufflé grillées, salées ou parfumées au soja." },
                    { name: "Yakisoba", desc: "Nouilles sautées sur plaque avec chou, porc et sauce acidulée." },
                    { name: "Tamagoyaki", desc: "Omelette japonaise légèrement sucrée et roulée en couches." }
                ]
            },
            {
                id: "desserts", icon: "🍡", title: "Desserts & Douceurs", jp: "甘味 (Kanmi)",
                items: [
                    { name: "Mochi", desc: "Pâtisserie de riz gluant pilé, fourrée à l'anko ou glacée." },
                    { name: "Dorayaki", desc: "Pancakes moelleux assemblés en sandwich autour d'anko sucré." },
                    { name: "Taiyaki", desc: "Gaufre en forme de poisson fourrée d'anko, crème ou chocolat." },
                    { name: "Dango", desc: "Brochettes de boulettes de riz nappées de sirop de soja sucré." },
                    { name: "Matcha Parfait", desc: "Dessert élaboré superposant glace matcha, mochi, azuki et gelée." },
                    { name: "Kakigori", desc: "Glace pilée fine comme de la neige avec sirops et lait concentré." },
                    { name: "Daifuku", desc: "Mochi fourré à l'anko enveloppant une fraise entière et juteuse (ichigo daifuku)." },
                    { name: "Anmitsu", desc: "Cubes de gelée d'agar-agar servis avec fruits, anko et sirop de sucre noir." },
                    { name: "Wagashi", desc: "Pâtisseries traditionnelles raffinées, façonnées selon les saisons, à déguster avec le thé." },
                    { name: "Fluffy Sponge Cake", desc: "Gâteau éponge japonais ultra-moelleux et aérien, qui tremble à la moindre secousse." }
                ]
            },
            {
                id: "boissons", icon: "🍵", title: "Boissons", jp: "飲み物 (Nomimono)",
                items: [
                    { name: "Calpis (Calpico)", desc: "Boisson rafraîchissante au lait fermenté, douce et acidulée." },
                    { name: "Thé Matcha", desc: "Thé vert en poudre battu au fouet bambou, végétal et amertume fine." },
                    { name: "Sake (Nihonshu)", desc: "Alcool de riz fermenté traditionnel, servi frais, tiède ou chaud." },
                    { name: "Umeshu", desc: "Liqueur douce et fruitée obtenue par macération de prunes vertes." },
                    { name: "Ramune", desc: "Limonade gazeuse emblématique servie dans sa bouteille à bille." }
                ]
            }
        ];

        const STORAGE_KEY = "japan_food_checklist_v2";
        const LEGACY_KEY = "japan_food_checklist"; // ancien format, indexé par position
        const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

        // --- Stockage sécurisé (navigation privée, stockage bloqué, données corrompues) ---
        let storageAvailable = true;

        function readStorage(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                storageAvailable = false;
                return null;
            }
        }

        function writeStorage(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                storageAvailable = false;
            }
        }

        function parseJSON(text) {
            try {
                return JSON.parse(text);
            } catch (e) {
                return null;
            }
        }

        // --- Rendu ---
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function renderCategories() {
            const main = document.getElementById("categories");

            categories.forEach((category) => {
                const section = el("section", "category");

                const head = el("div", "category-head");
                const icon = el("div", "category-icon " + category.id, category.icon);
                icon.setAttribute("aria-hidden", "true");
                const headText = el("div");
                headText.appendChild(el("h2", null, category.title));
                const jp = el("span", "category-jp font-japanese", category.jp);
                headText.appendChild(jp);
                head.append(icon, headText);

                const list = el("div", "items");
                category.items.forEach((item) => {
                    const label = el("label", "item");

                    const input = el("input", "sr-only");
                    input.type = "checkbox";
                    input.dataset.name = item.name;
                    input.addEventListener("change", onChange);

                    const box = el("span", "checkbox-icon");
                    box.innerHTML = CHECK_SVG;

                    const text = el("span", "item-text");
                    text.append(el("span", "item-title", item.name), el("span", "item-desc", item.desc));

                    label.append(input, box, text);
                    list.appendChild(label);
                });

                section.append(head, list);
                main.appendChild(section);
            });
        }

        // --- État ---
        function allCheckboxes() {
            return document.querySelectorAll('#categories input[type="checkbox"]');
        }

        function loadState() {
            let checked = parseJSON(readStorage(STORAGE_KEY));

            // Migration depuis l'ancien format (identifiants "container-<catégorie>-<index>")
            if (!Array.isArray(checked)) {
                checked = [];
                const legacy = parseJSON(readStorage(LEGACY_KEY));
                if (legacy && typeof legacy === "object") {
                    categories.forEach((category) => {
                        category.items.forEach((item, index) => {
                            if (legacy[`container-${category.id}-${index}`]) checked.push(item.name);
                        });
                    });
                }
            }

            const names = new Set(checked);
            allCheckboxes().forEach((cb) => {
                cb.checked = names.has(cb.dataset.name);
            });
        }

        function saveState() {
            const checked = [...allCheckboxes()].filter((cb) => cb.checked).map((cb) => cb.dataset.name);
            writeStorage(STORAGE_KEY, JSON.stringify(checked));
        }

        function updateProgress() {
            const checkboxes = allCheckboxes();
            const total = checkboxes.length;
            const checkedCount = [...checkboxes].filter((cb) => cb.checked).length;
            const percent = total ? Math.round((checkedCount / total) * 100) : 0;

            document.getElementById("progress-bar").style.width = `${percent}%`;
            document.getElementById("progress").setAttribute("aria-valuenow", percent);
            document.getElementById("progress-text").textContent = `${checkedCount} sur ${total} goûtés`;
            document.getElementById("progress-percent").textContent = `${percent}%`;

            if (!storageAvailable) {
                document.getElementById("storage-note").textContent =
                    "Sauvegarde indisponible dans ce navigateur : vos coches seront perdues à la fermeture.";
            }
        }

        function onChange() {
            saveState();
            updateProgress();
        }

        function resetChecklist() {
            if (confirm("Voulez-vous vraiment réinitialiser toute votre liste ?")) {
                allCheckboxes().forEach((cb) => (cb.checked = false));
                saveState();
                updateProgress();
            }
        }

        // --- Initialisation ---
        renderCategories();
        loadState();
        updateProgress();

        // --- Mode hors ligne (service worker) ---
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            });
        }
    </script>
</body>
</html>
